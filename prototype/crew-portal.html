<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<title>Herkey Crew & Office</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: staff workspace. Glass side rail + top bar over a slow topographic gold contour field; dense content panels. Dark-only in the dark-and-gold house style. */
:root{
  color-scheme:dark;
  --ink:#0B0C0E; --ink-2:#121417; --panel:rgba(19,21,25,.78); --panel-2:rgba(255,255,255,.035); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --text:#ECEEF0; --muted:#979EA7; --gold:#C49A50; --gold-hi:#E6C27E; --gold-deep:#8A672C; --on-gold:#17191C;
  --ok:#6FD39C; --warn:#F0B758; --bad:#FF8F86; --info:#8EBBEA; --violet:#B9A3F5;
  --display:"Archivo",system-ui,sans-serif; --serif:"Cormorant Garamond",Georgia,serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:12px; --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--ink)}
#bg{position:fixed;inset:-2%;width:104%;height:104%;z-index:0;filter:blur(2.2px);opacity:.95}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(90% 70% at 70% 10%,rgba(11,12,14,.2),rgba(11,12,14,.75) 70%)}
.app{position:relative;z-index:3}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:clamp(1.5rem,3vw,2rem);font-weight:700}
h3{font-size:1.05rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .tnum{font-variant-numeric:tabular-nums} .mono{font-family:var(--mono);font-size:.82em;letter-spacing:-.01em}
.eyebrow{font-family:var(--display);font-size:.68rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(11,12,14,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding:10px var(--gr) 10px var(--gl);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mono-b{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#F2D69A,var(--gold) 45%,var(--gold-deep));font-family:var(--serif);font-weight:700;color:#1A1408;font-size:.8rem;flex:none}
.brand b{font-family:var(--serif);font-size:1.12rem;font-weight:700;line-height:1}
.brand small{display:block;font-family:var(--display);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-top:3px}
.viewas{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.viewas select{background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;color:var(--text);font-weight:600}
.viewas select option{background:#15171A}
.who{display:flex;align-items:center;gap:8px;font-size:.85rem}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#2A2D33,#191B1F);border:1px solid var(--line-2);color:var(--gold-hi);font-weight:700;font-size:.72rem;flex:none;font-family:var(--display)}
@media (max-width:640px){ .who span{display:none} .viewas span{display:none} }

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);gap:22px;max-width:1320px;margin:0 auto;padding:20px var(--gr) 48px var(--gl)}
.rail{position:sticky;top:80px;align-self:start;display:flex;flex-direction:column;gap:2px;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.rail .role{padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rail .role b{display:block;font-family:var(--display);font-size:1rem}
.rail .role small{color:var(--muted);font-size:.78rem}
.nb{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-weight:500;text-align:left}
.nb svg{width:18px;height:18px;flex:none}
.nb:hover{color:var(--text);background:rgba(255,255,255,.04)}
.nb[aria-current="page"]{color:var(--text);background:linear-gradient(90deg,rgba(196,154,80,.2),rgba(196,154,80,.04));box-shadow:inset 2px 0 0 var(--gold)}
.nb .ct{margin-left:auto;font-size:.7rem;font-weight:700;background:var(--gold);color:var(--on-gold);border-radius:99px;padding:1px 7px}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;z-index:45;flex-direction:row;border-radius:0;border-width:1px 0 0;justify-content:space-around;
    padding:6px var(--gr) calc(8px + env(safe-area-inset-bottom,0px)) var(--gl);background:rgba(14,15,18,.9);overflow-x:auto}
  .rail .role{display:none}
  .nb{flex-direction:column;gap:3px;font-size:.66rem;padding:6px 4px;flex:1;min-width:56px}
  .nb span.l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .nb[aria-current="page"]{background:none;box-shadow:inset 0 2px 0 var(--gold);color:var(--gold-hi)}
  .nb .ct{position:absolute;margin:0;transform:translate(12px,-4px);font-size:.6rem;padding:0 5px}
  .nb{position:relative}
}

/* pieces */
.head{display:flex;flex-wrap:wrap;align-items:end;gap:10px 16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:64ch}
.head .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1)}
.pad{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;border:1px solid var(--line-2);background:rgba(255,255,255,.04);white-space:nowrap;transition:background .2s,border-color .2s,transform .1s}
.btn:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}
.btn:active{transform:translateY(1px)}
.btn.gold{background:linear-gradient(135deg,var(--gold-hi),var(--gold) 55%,#B58B44);border-color:transparent;color:var(--on-gold);box-shadow:0 8px 22px -10px rgba(196,154,80,.8)}
.btn.sm{padding:6px 11px;font-size:.84rem}
.btn.ok{border-color:rgba(111,211,156,.5);color:var(--ok)} .btn.no{border-color:rgba(255,143,134,.45);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:16px;height:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.8rem;font-weight:600;color:#C2C7CD}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{width:100%;background:rgba(8,9,11,.6);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;color:var(--text);font-weight:400}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,154,80,.18)}
select option{background:#15171A}
textarea{min-height:76px;resize:vertical}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-gold{color:var(--gold-hi)} .p-ok{color:var(--ok)} .p-warn{color:var(--warn)} .p-bad{color:var(--bad)} .p-info{color:var(--info)} .p-muted{color:var(--muted)} .p-violet{color:var(--violet)}
.prio{font-size:.66rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.prio.urgent{color:var(--bad)} .prio.soon{color:var(--warn)} .prio.routine{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:rgba(255,255,255,.03);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.84rem}
.chip[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.notice{border-radius:8px;padding:10px 12px;font-size:.88rem;border:1px solid}
.notice.ok{color:var(--ok);border-color:rgba(111,211,156,.35);background:rgba(111,211,156,.08)}
.notice.bad{color:var(--bad);border-color:rgba(255,143,134,.35);background:rgba(255,143,134,.08)}
.notice.warn{color:var(--warn);border-color:rgba(240,183,88,.35);background:rgba(240,183,88,.08)}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.kpi{padding:16px;position:relative;overflow:hidden}
.kpi small{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi b{display:block;font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(196,154,80,.22),transparent 70%)}

/* job rows */
.list{display:flex;flex-direction:column;overflow:hidden}
.jr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.jr:first-child{border-top:0}
.jr:hover{background:rgba(255,255,255,.03)}
.jr .ic{grid-row:1/3;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:rgba(196,154,80,.1);border:1px solid rgba(196,154,80,.25);color:var(--gold-hi)}
.jr .ic svg{width:22px;height:22px}
.jr .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr .s{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;grid-column:2}
.jr .e{grid-row:1/3;grid-column:3;display:flex;flex-direction:column;align-items:end;gap:5px}
@media (max-width:540px){ .jr{grid-template-columns:40px minmax(0,1fr)} .jr .e{grid-row:auto;grid-column:2;flex-direction:row;align-items:center} }

/* clock */
.clock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:620px){ .clock{grid-template-columns:minmax(0,1fr)} }
.ring{width:170px;height:170px;position:relative;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .in b{font-family:var(--mono);font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums}
.ring .in small{display:block;font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.bigbtn{width:100%;padding:16px;font-size:1.05rem;border-radius:12px}

/* bars & charts */
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:120px minmax(0,1fr) 80px;gap:10px;align-items:center;font-size:.86rem}
.bar .tr{height:10px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.bar .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--gold-deep),var(--gold-hi));transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both}
.bar .fl.alt{background:linear-gradient(90deg,#3E5F80,var(--info))}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
@keyframes grow{from{transform:scaleX(.02)}to{transform:none}}
@media (prefers-reduced-motion:reduce){ .bar .fl{animation:none} }
@media (max-width:520px){ .bar{grid-template-columns:90px minmax(0,1fr) 64px} }
.chart{width:100%;height:auto;display:block}

/* schedule board */
.board{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;overflow-x:auto;padding-bottom:4px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h4{margin:0;font-family:var(--display);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:6px 2px;border-bottom:1px solid var(--line)}
.col h4.today{color:var(--gold-hi);border-color:var(--gold)}
.card-j{padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;font-size:.82rem;border-left:3px solid var(--gold)}
.card-j b{font-size:.86rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-j:hover{background:rgba(255,255,255,.07)}
.card-j.st-completed{border-left-color:var(--ok);opacity:.7}.card-j.st-in-progress{border-left-color:var(--warn)}.card-j.st-on-hold{border-left-color:var(--muted)}.card-j.st-requested{border-left-color:var(--info)}.card-j.st-accepted{border-left-color:var(--violet)}

/* tables */
.tw{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;background:rgba(255,255,255,.03);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.c{font-family:var(--mono);font-size:.78rem;color:var(--gold-hi)}

/* drawer */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(4,5,6,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;justify-content:flex-end}
.drawer{width:min(600px,100%);height:100%;overflow-y:auto;background:rgba(15,16,19,.96);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:16px;
  padding:calc(20px + env(safe-area-inset-top,0px)) var(--gr) calc(28px + env(safe-area-inset-bottom,0px)) 20px}
@media (prefers-reduced-motion:no-preference){ .drawer{animation:sl .3s cubic-bezier(.2,.7,.2,1)} @keyframes sl{from{transform:translateX(36px);opacity:.4}to{transform:none;opacity:1}} }
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.steps5 div{font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-top:3px solid var(--line-2);padding-top:6px}
.steps5 div.on{border-color:var(--gold);color:var(--text)}
dl.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;margin:0;font-size:.88rem}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;border:2px solid var(--gold);margin-top:6px}
.tl li::after{content:"";position:absolute;left:5px;top:19px;bottom:0;width:1px;background:var(--line-2)}
.tl li:last-child::after{display:none}
.tl small{display:block;color:var(--muted);font-size:.78rem}
.lines{display:flex;flex-direction:column;gap:6px}
.line{display:grid;grid-template-columns:minmax(0,1fr) 70px 96px 34px;gap:6px}
.lock{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.84rem;padding:10px 12px;border:1px dashed var(--line-2);border-radius:8px}
.lock svg{width:16px;height:16px;flex:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:80;background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:var(--on-gold);font-weight:600;padding:11px 16px;border-radius:10px;box-shadow:0 14px 40px -10px rgba(0,0,0,.7);max-width:calc(100% - 32px)}
@media (max-width:900px){ .toast{bottom:calc(98px + env(safe-area-inset-bottom,0px))} }
.check{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.check li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start}
.tk{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:.7rem;font-weight:800;margin-top:2px}
.tk.y{background:rgba(111,211,156,.18);color:var(--ok)} .tk.p{background:var(--gold);color:var(--on-gold)} .tk.n{background:rgba(255,255,255,.06);color:var(--muted)}
.matrix th,.matrix td{text-align:center;padding:9px 8px} .matrix th{letter-spacing:.08em} .matrix th:first-child,.matrix td:first-child{text-align:left;white-space:normal;min-width:150px;padding-left:12px}
.yes{color:var(--ok);font-weight:700} .lim{color:var(--warn);font-size:.78rem}
.sample{font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line-2);padding:2px 9px;border-radius:99px}
</style>

<div class="app">

</div>
<div id="layer"></div>

<script>
/* ---------- Topographic gold contours (slow) ---------- */
(() => {
  const c=document.getElementById('bg'), x=c.getContext('2d'); const W=260,H=156; c.width=W; c.height=H;
  const img=x.createImageData(W,H);
  const P=new Uint8Array(512); { const p=[...Array(256).keys()]; let s=11; for(let i=255;i>0;i--){ s=(s*16807)%2147483647; const j=s%(i+1); [p[i],p[j]]=[p[j],p[i]]; } for(let i=0;i<512;i++) P[i]=p[i&255]; }
  const f=t=>t*t*(3-2*t), h=(i,j)=>P[P[i&255]+(j&255)]/255;
  const n=(X,Y)=>{ const i=Math.floor(X),j=Math.floor(Y),u=f(X-i),v=f(Y-j),a=h(i,j),b=h(i+1,j),c2=h(i,j+1),d=h(i+1,j+1); return a+(b-a)*u+(c2-a)*v+(a-b-c2+d)*u*v; };
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t=3, last=0;
  function frame(now){
    if(now-last>60||reduce){ last=now; t+=reduce?0:.0025; const d=img.data; let k=0;
      for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){
        const X=xx/W*4, Y=y/H*2.4;
        const e=n(X+t*.5,Y+t*.2)*.65+n(X*2.2-t*.3,Y*2.2+4)*.35;
        const v=e*22, fr=v-Math.floor(v);
        const line=Math.max(0,1-Math.abs(fr-.5)*6);         // thin contour lines
        const major=(Math.floor(v)%5===0)?1.6:1;                 // every 5th line brighter
        const glow=Math.pow(e,3)*.35;
        const a=Math.min(1,line*.32*major+glow*.25);
        d[k++]=11+a*200; d[k++]=12+a*150; d[k++]=14+a*72; d[k++]=255;
      }
      x.putImageData(img,0,0);
    }
    if(!reduce) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

function spendChart(){ const now=Date.now(), N=8, vals=[]; for(let i=N-1;i>=0;i--){ const a=now-(i+1)*7*DAY,b=now-i*7*DAY; vals.push(S.expenses.filter(e=>e.status==='Approved'&&e.date>a&&e.date<=b).reduce((s,e)=>s+e.amount,0)/100); }
  const W=480,H=170,pl=52,pr=16,pt=14,pb=28, mx=Math.max(200,Math.ceil(Math.max(...vals)/250)*250);
  const x=i=>pl+i*(W-pl-pr)/(N-1), y=v=>pt+(H-pt-pb)*(1-v/mx); const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Approved spending per week, last 8 weeks"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6C27E" stop-opacity=".45"/><stop offset="1" stop-color="#E6C27E" stop-opacity="0"/></linearGradient></defs>
    ${[0,mx/2,mx].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#979EA7">$${v.toLocaleString()}</text>`).join('')}
    <polygon points="${pl},${y(0)} ${pts} ${x(N-1)},${y(0)}" fill="url(#sg)"/><polyline points="${pts}" fill="none" stroke="#E6C27E" stroke-width="2.2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===N-1?4.5:2.5}" fill="${i===N-1?'#E6C27E':'#C49A50'}"/>`).join('')}
    ${vals.map((v,i)=>i%2||i===N-1?`<text x="${x(i)}" y="${H-8}" text-anchor="${i===N-1?'end':'middle'}" font-size="12" fill="#979EA7">${i===N-1?'This week':(N-1-i)+'w ago'}</text>`:'').join('')}</svg>`; }

const V={};

  const pend=S.time.find(t=>t.user===m.id&&t.review==='Pending');
  const mine=S.jobs.filter(j=>j.crew===m.id&&!['Completed','Canceled'].includes(j.status)).sort((a,b)=>(a.day??9e15)-(b.day??9e15));
  const wk=S.time.filter(t=>t.user===m.id&&t.in>sod(Date.now())-6*DAY), hrs=wk.reduce((a,t)=>a+((t.out||Date.now())-t.in)/HR,0);
  if(sh) after.push(()=>tick(sh.in));

  return head(new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}),`${greet}, ${esc(m.name.split(' ')[0])}.`,`Clock in within ${FENCE} m of a job site. Your location is a supporting check; the office reviews anything flagged.`,'<span class="sample">Sample data</span>')+`

        <div class="in"><div><small>${sh?'On the clock':'Off the clock'}</small><b id="timer">${sh?'0:00:00':'—'}</b><small>${sh?'since '+fT(sh.in):'8 h shift'}</small></div></div></div>
      <div class="stack">
        <label class="f">Your location (simulated GPS)<select id="gps"><option value="off" ${here==='off'?'selected':''}>Away from job sites</option>${S.customers.map(c=>`<option value="${c.id}" ${here===c.id?'selected':''}>At ${esc(c.addr)}</option>`).join('')}</select></label>
        ${sh?`<div class="notice ok">Clocked in at ${esc(C(sh.site).addr)} · ${sh.dist} m from site · verified</div>`:inside?`<div class="notice ok">You're ${Math.round(near.d)} m from ${esc(near.c.addr)}. Good to clock in.</div>`:`<div class="notice bad">You're ${(near.d/1000).toFixed(1)} km from the nearest job site. Move within ${FENCE} m, or clock in for review.</div>`}

  </div>

let timerH; function tick(since){ clearInterval(timerH); const el=$('#timer'), arc=$('#arc'); if(!el) return; const f=()=>{ const s=Math.floor((Date.now()-since)/1000); el.textContent=`${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; if(arc) arc.setAttribute('stroke-dashoffset',(326.7*(1-Math.min(1,s/28800))).toFixed(1)); }; f(); timerH=setInterval(()=>{ if(!document.body.contains(el)) return clearInterval(timerH); f(); },1000); }

function docCard(d,kind){ const j=Jb(d.job), c=j?C(j.cust):null; let a='';
  if(kind==='est'){ if(d.status==='Draft'&&can.estimate()) a=`<button class="btn sm gold" data-est="${d.id}" data-do="send">Send to customer</button>`;
    if(d.status==='Accepted'&&can.invoice()&&!S.invoices.some(i=>i.job===d.job)) a=`<button class="btn sm gold" data-est="${d.id}" data-do="inv">Create invoice</button>`; }
  else { if(d.status==='Draft'&&can.invoice()) a=`<button class="btn sm gold" data-inv="${d.id}" data-do="send">Send</button>`;
    if(d.status==='Unpaid'&&can.invoice()) a=`<button class="btn sm ok" data-inv="${d.id}" data-do="paid">Mark paid</button><button class="btn sm no" data-inv="${d.id}" data-do="void">Void</button>`; }
  return `<div class="glass pad stack"><div class="row" style="justify-content:space-between;align-items:start"><div><span class="mono muted">${d.id}</span><div style="font-weight:600">${esc(j?j.title:'Job '+d.job+' (not found)')}</div><div class="muted" style="font-size:.82rem">${esc(c?c.name:'Unknown customer')} · ${fD(d.created)}</div></div><div style="text-align:right"><div style="font-family:var(--display);font-size:1.4rem;font-weight:700" class="tnum">${usd(tot(d))}</div>${pill(d.status)}</div></div>
    <div class="tw" style="background:none"><table><tbody>${d.lines.map(([n,q,p])=>`<tr><td style="white-space:normal">${esc(n)}</td><td class="n">${q} × ${usd(p)}</td><td class="n">${usd(Math.round(q*p))}</td></tr>`).join('')}</tbody></table></div>${a?`<div class="row">${a}</div>`:''}</div>`; }

V.payroll=()=>{ const now=Date.now(), from=sod(now)-6*DAY;
  const rows=crew().map(u=>{ const ts=S.time.filter(t=>t.user===u.id&&t.in>=from&&t.review!=='Rejected'); const h=ts.reduce((a,t)=>a+((t.out||now)-t.in)/HR,0), ot=Math.max(0,h-40); const rate=u.rate||0; return {u,n:ts.length,h,ot,noRate:!u.rate,gross:Math.round((h-ot)*rate+ot*rate*1.5),flag:ts.some(t=>t.review==='Pending'),open:ts.some(t=>!t.out)}; });
  const g=rows.reduce((a,r)=>a+r.gross,0);
  return head('Time & payroll','Last 7 days','From time clock records. Overtime at 1.5× over 40 hours. Flagged entries need approval before export.','<span class="sample">Rules not final</span>')+

  <div class="tw"><table><thead><tr><th>Crew member</th><th class="n">Rate</th><th class="n">Shifts</th><th class="n">Hours</th><th class="n">OT</th><th class="n">Gross</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.u.name)}</td><td class="n">${r.noRate?pill('Rate missing','p-warn'):usd(r.u.rate)}</td><td class="n">${r.n}</td><td class="n">${r.h.toFixed(2)}</td><td class="n">${r.ot.toFixed(2)}</td><td class="n">${usd(r.gross)}</td><td>${r.noRate?'<span class="muted" style="font-size:.78rem">Admin: set rate in Team</span> ':''}${r.flag?pill('Needs review'):''}${r.open?pill('On clock','p-gold'):''}</td></tr>`).join('')}
  <tr><td><b>Total</b></td><td></td><td></td><td class="n"><b>${rows.reduce((a,r)=>a+r.h,0).toFixed(2)}</b></td><td></td><td class="n"><b>${usd(g)}</b></td><td></td></tr></tbody></table></div>`; };

  <div class="tw"><table><thead><tr><th>Name</th><th>Role</th><th class="n">Rate / h</th><th>Email</th><th>Phone</th><th>Status</th></tr></thead><tbody>${S.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${u.id===me().id?ROLE_LABEL[u.role]+' (you)':`<select data-setrole="${u.id}" aria-label="Role for ${esc(u.name)}" style="padding:4px 8px;width:auto">${groups.map(([v,l])=>`<option value="${v}" ${u.role===v?'selected':''}>${l}</option>`).join('')}</select>`}</td><td class="n">${['Crew','CrewLead'].includes(u.role)?`<input type="number" data-setrate="${u.id}" aria-label="Hourly rate for ${esc(u.name)}" min="0" step="0.5" value="${u.rate?(u.rate/100).toFixed(2):''}" placeholder="Missing" style="width:90px;padding:4px 8px;text-align:right${u.rate?'':';border-color:var(--warn)'}">`:'<span class="muted">—</span>'}</td><td>${esc(u.email||'—')}</td><td class="tnum">${esc(u.phone||'—')}</td><td>${pill(u.status)}</td></tr>`).join('')}</tbody></table></div>
  <div class="glass pad stack"><h3>Access changes</h3>${S.audit.length?`<ul class="tl">${[...S.audit].reverse().slice(0,12).map(l=>`<li><div>${esc(l.x)}<small>${esc(l.by)} · ${fDT(l.t)}</small></div></li>`).join('')}</ul>`:'<div class="muted">No role or invite changes yet.</div>'}</div>`; };
let ts='Jobs';
const TB={
  Jobs:()=>S.jobs.map(j=>({id:j.id,title:j.title,category:j.category,priority:j.priority,status:j.status,customer_id:j.cust,crew_id:j.crew||'',scheduled:j.day!=null?fD(j.day)+' '+SLOTS[j.slot]:'',created_utc:new Date(j.created).toISOString(),completed_utc:j.completed?new Date(j.completed).toISOString():''})),
  Customers:()=>S.customers.map(c=>({id:c.id,name:c.name,phone:c.phone,address:c.addr,lat:c.lat,lng:c.lng})),
  Users:()=>S.users.map(u=>({id:u.id,name:u.name,role:u.role,email:u.email,phone:u.phone,status:u.status,rate_cents:u.rate??''})),
  Estimates:()=>S.estimates.map(e=>({id:e.id,job_id:e.job,status:e.status,total_cents:tot(e),lines:e.lines.length,created_utc:new Date(e.created).toISOString()})),
  Invoices:()=>S.invoices.map(e=>({id:e.id,job_id:e.job,status:e.status,total_cents:tot(e),created_utc:new Date(e.created).toISOString()})),
  Expenses:()=>S.expenses.map(e=>({id:e.id,user_id:e.by,job_id:e.job||'',category:e.cat,vendor:e.vendor,amount_cents:e.amount,status:e.status,date_utc:new Date(e.date).toISOString()})),
  TimeEntries:()=>S.time.map(t=>({id:t.id,user_id:t.user,site_id:t.site,in_utc:new Date(t.in).toISOString(),out_utc:t.out?new Date(t.out).toISOString():'',distance_m:t.dist,location_check:t.check,review:t.review})),
  AccessLog:()=>S.audit.map(l=>({at_utc:new Date(l.t).toISOString(),by:l.by,action:l.x})).reverse(),
  ActivityLog:()=>S.jobs.flatMap(j=>j.log.map(l=>({job_id:j.id,at_utc:new Date(l.t).toISOString(),by:l.by,action:l.x}))).sort((a,b)=>b.at_utc.localeCompare(a.at_utc)),
};
V.data=()=>{ const rows=TB[ts](), cols=rows.length?Object.keys(rows[0]):[], num=c=>/cents|distance|lines|lat|lng/.test(c);
  return head('Data tables','Raw records','The underlying tables with stable IDs. Money in cents, timestamps in UTC. Admin only.','<button class="btn" data-a="csv">Copy as CSV</button>')+
  `<div class="chips">${Object.keys(TB).map(k=>`<button class="chip mono" data-ts="${k}" aria-pressed="${ts===k}">${k}</button>`).join('')}</div><div class="muted" style="font-size:.82rem">${rows.length} rows · ${cols.length} columns</div>
  <div class="tw" style="max-height:62vh"><table><thead><tr>${cols.map(c=>`<th class="${num(c)?'n':''}">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td class="${/^id$|_id$/.test(c)?'c':''} ${num(c)?'n':''}">${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; };
const LAUNCH=[
  ['Company name, legal entity, colors, and whether a public website is needed'],['Signed-in customer portal vs. public request form; sign-in method and invite delivery'],
  ['Scheduling rules, what crew see before claiming, completion approvals, approval limits'],['Company timezone, geofence radius, breaks, rounding, overtime, corrections'],
  ['Estimate/invoice format, taxes, numbering, payment provider, accounting connection'],['Which Google services, if any: Calendar, Drive, Sheets, Gmail'],
  ['Photo visibility, privacy terms, retention, backups, offboarding'],['Long-term owner, admin handover, check-in cadence'],['HerkeyHouse: same app or separate product'],['Platform: Glide rebuild vs. this custom build (one live system only)'],
];
V.launch=()=>head('Launch list','Decisions before go-live','From the Construction & Maintenance key points. Notes are saved in this browser only.','<button class="btn" data-a="reset">Reset demo data</button>')+`
  <div class="g2"><div class="glass pad stack"><h3>First-release features</h3><ul class="check">${[['p','User access with five roles'],['p','Customer requests (separate portal)'],['p','Job claim, assignment and status flow'],['p','Scheduling board'],['p','Estimate and invoice records'],['p','Expense submission and approval'],['p','Geofenced time clock with review'],['p','Activity history'],['p','Management reporting'],['n','Job photos'],['n','Automated SMS and email'],['n','Online payments'],['n','Accounting and Google connections']].map(([s,t])=>`<li><span class="tk ${s}">${s==='p'?'P':'·'}</span><span>${t}</span></li>`).join('')}</ul><div class="muted" style="font-size:.8rem"><span class="tk p" style="display:inline-grid;vertical-align:middle">P</span> in this prototype · <span class="tk n" style="display:inline-grid;vertical-align:middle">·</span> later</div></div>
  <div class="glass pad stack"><h3>Open decisions</h3>${LAUNCH.map(([q],i)=>`<label class="f" style="font-weight:500;color:var(--text)">${esc(q)}<textarea id="ans-${i}" data-ans="${i}" placeholder="Decision or owner" style="min-height:44px">${esc(S.answers[i]||'')}</textarea></label>`).join('')}</div></div>`;

/* ---------- job drawer ---------- */
let open=null, estDraft=null;
function drawer(){ if(!open){ $('#layer').innerHTML=''; return; }
  const j=Jb(open), c=C(j.cust), m=me(), mine=j.crew===m.id, hide=!j.crew&&S.role==='Crew';
  const idx=FLOW.indexOf(j.status); let A='';
  if(can.assign()) A+=`<div class="glass pad stack"><h3>Manage</h3><div class="g2" style="gap:10px">
    <label class="f">Crew<select data-set="crew"><option value="">Unassigned</option>${crew().map(u=>`<option value="${u.id}" ${j.crew===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label>
    <label class="f">Status<select data-set="status">${ALL.map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="f">Day<select data-set="day"><option value="">Not scheduled</option>${(()=>{const o=[];let d=sod(Date.now());while(o.length<10){const w=new Date(d).getDay();if(w&&w!==6)o.push(d);d+=DAY;} if(j.day!=null&&!o.includes(j.day)) o.unshift(j.day); return o;})().map(d=>`<option value="${d}" ${j.day===d?'selected':''}>${fDay(d)}</option>`).join('')}</select></label>
    <label class="f">Time<select data-set="slot">${SLOTS.map((s,i)=>`<option value="${i}" ${j.slot===i?'selected':''}>${s}</option>`).join('')}</select></label></div></div>`;
  if(S.role==='Crew'&&!j.crew&&j.status==='Requested') A+=`<button class="btn gold bigbtn" data-claim="${j.id}">Claim this job</button>`;
  if((mine||S.role==='CrewLead')&&!['Completed','Canceled'].includes(j.status)&&j.crew){ A+=`<div class="glass pad stack"><h3>Update</h3><div class="row">
    ${j.status!=='In Progress'?`<button class="btn gold" data-st="In Progress">Start work</button>`:''}${j.status==='In Progress'?`<button class="btn gold" data-st="Completed">Mark complete</button>`:''}${j.status!=='On Hold'?`<button class="btn" data-st="On Hold">Put on hold</button>`:''}</div>
    <label class="f">Progress note<textarea id="pn" placeholder="What you did, what's left, parts needed"></textarea></label><div class="row"><button class="btn" data-a="note">Add note</button></div></div>`; }
  if(can.estimate()&&(mine||S.role!=='Crew')&&!['Completed','Canceled'].includes(j.status)&&j.crew!==null||(can.estimate()&&S.role!=='Crew'&&!['Completed','Canceled'].includes(j.status))){
    if(!estDraft) A+=`<div class="row"><button class="btn" data-a="newest">Draft an estimate</button></div>`;
    else A+=`<form class="glass pad stack" id="estForm"><h3>New estimate</h3><div class="lines">${estDraft.map((l,i)=>`<div class="line"><input type="text" id="el-d-${i}" data-el="${i}" data-k="d" value="${esc(l.d)}" placeholder="Item" aria-label="Item"><input type="number" id="el-q-${i}" data-el="${i}" data-k="q" value="${l.q}" min="0" step="0.25" aria-label="Qty"><input type="number" id="el-p-${i}" data-el="${i}" data-k="p" value="${l.p}" min="0" step="1" aria-label="Unit price ($)"><button type="button" class="btn sm" data-rm="${i}" aria-label="Remove line">×</button></div>`).join('')}</div>
      <div class="row"><button type="button" class="btn sm" data-a="addline">Add line</button><span style="margin-left:auto" class="tnum">Total <b id="et">${usd(Math.round(estDraft.reduce((a,l)=>a+l.q*l.p*100,0)))}</b></span></div>
      <div class="row"><button class="btn gold" type="submit">Save as draft</button><button type="button" class="btn" data-a="cancelest">Cancel</button></div></form>`; }
  const docs=[...S.estimates.filter(d=>d.job===j.id).map(d=>docCard(d,'est')),...S.invoices.filter(d=>d.job===j.id).map(d=>docCard(d,'inv'))];
  $('#layer').innerHTML=`<div class="scrim" data-scrim><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dh">
    <div class="row" style="justify-content:space-between"><span class="mono muted">${j.id} · ${esc(j.category)}</span><button class="btn sm" data-a="close">Close</button></div>
    <div><h2 id="dh">${esc(j.title)}</h2><div class="row" style="margin-top:8px">${pill(j.status)}<span class="prio ${j.priority}">${j.priority==='urgent'?'Emergency':j.priority}</span></div></div>
    <div class="steps5">${FLOW.map((s,i)=>`<div class="${i<=idx?'on':''}">${s}</div>`).join('')}</div>
    <div class="glass pad"><dl class="kv"><dt>Customer</dt><dd>${hide?'<span class="muted">Shown after you claim</span>':esc(c.name)+`<div class="muted tnum">${esc(c.phone)}</div>`}</dd><dt>Address</dt><dd>${hide?esc(c.area)+' <span class="muted">(exact address after claim)</span>':esc(c.addr)}</dd><dt>When</dt><dd>${esc(when(j))}</dd><dt>Crew</dt><dd>${j.crew?esc(U(j.crew).name):'Unassigned'}</dd><dt>Details</dt><dd style="white-space:pre-wrap">${esc(j.desc||'—')}</dd></dl></div>
    ${A}
    ${docs.length?`<div class="stack"><h3>Estimates & invoices</h3>${docs.join('')}</div>`:''}
    <div class="stack"><h3>Activity</h3><ul class="tl">${[...j.log].reverse().map(l=>`<li><div>${esc(l.x)}<small>${esc(l.by)} · ${fDT(l.t)}</small></div></li>`).join('')}</ul></div>
  </div></div>`; }
const log=(j,x)=>j.log.push({t:Date.now(),by:me().name,x});
function readEst(){ document.querySelectorAll('[data-el]').forEach(i=>{ const l=estDraft[+i.dataset.el]; if(l) l[i.dataset.k]=i.dataset.k==='d'?i.value:(+i.value||0); }); }

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-scrim]'); if(!b) return;
  if(b.matches('[data-scrim]')){ if(e.target===b){ open=null; drawer(); } return; }
  const d=b.dataset, m=me();
  if(d.v){ S.views[S.role]=d.v; open=null; drawer(); render(); window.scrollTo({top:0}); return; }
  if(d.open){ open=d.open; estDraft=null; drawer(); return; }
  if(d.claim){ const j=Jb(d.claim); if(j.crew){ toast('Someone already claimed this job.'); render(); return; } j.crew=m.id; j.status='Accepted'; log(j,'Claimed job'); toast(`${j.id} is yours`); render(); if(open) drawer(); return; }
  if(d.jf){ jf=d.jf; render(); return; } if(d.bf){ bf=d.bf; render(); return; } if(d.ts){ ts=d.ts; render(); return; } if(d.invby){ const keep={n:$('#i-name')?.value||'',r:$('#i-role')?.value}; invBy=d.invby; render(); $('#i-name').value=keep.n; if(keep.r) $('#i-role').value=keep.r; $('#i-c').focus(); return; }
  if(d.st){ const j=Jb(open); j.status=d.st; if(d.st==='Completed') j.completed=Date.now(); log(j,'Status: '+d.st); toast(`${j.id}: ${d.st}`); render(); drawer(); return; }
  if(d.exp){ const x=S.expenses.find(z=>z.id===d.exp); x.status=d.ok==='1'?'Approved':'Rejected'; toast(`Expense ${x.status.toLowerCase()}`); render(); return; }
  if(d.tf){ const t=S.time.find(z=>z.id===d.tf); t.review=d.ok==='1'?'Approved':'Rejected'; t.check=d.ok==='1'?'Approved by lead':t.check; toast(`Clock-in ${t.review.toLowerCase()}`); render(); return; }
  if(d.est){ const x=S.estimates.find(z=>z.id===d.est), j=Jb(x.job);
    if(d.do==='send'){ x.status='Sent'; if(j) log(j,`Estimate ${x.id} sent to customer`); toast(`${x.id} sent`); }
    if(d.do==='inv'){ const id='INV-'+(S.seq.inv++); S.invoices.push({id,job:x.job,status:'Draft',created:Date.now(),lines:x.lines.map(l=>[...l])}); if(j) log(j,`Invoice ${id} drafted from ${x.id}`); toast(`${id} drafted`); bf='Invoices'; }
    render(); if(open) drawer(); return; }
  if(d.inv){ const x=S.invoices.find(z=>z.id===d.inv), j=Jb(x.job); x.status={send:'Unpaid',paid:'Paid',void:'Void'}[d.do]; if(j) log(j,`Invoice ${x.id}: ${x.status}`); toast(`${x.id}: ${x.status}`); render(); if(open) drawer(); return; }
  if(d.rm!=null&&d.rm!==''){ readEst(); estDraft.splice(+d.rm,1); if(!estDraft.length) estDraft.push({d:'',q:1,p:0}); drawer(); return; }
  const a=d.a; if(!a) return;
  if(a==='close'){ open=null; drawer(); return; }
  if(a==='in'||a==='inflag'){ const here=S.gps[m.id]; const pos=here==='off'?{lat:40.0790,lng:-76.2600}:C(here); const near=S.customers.map(c=>({c,dd:dist(pos,c)})).sort((x,y)=>x.dd-y.dd)[0];
    S.time.push({id:uid('T'),user:m.id,in:Date.now(),out:null,site:near.c.id,dist:Math.round(near.dd),check:a==='in'?'Verified':'Needs review',review:a==='in'?'Open':'Pending',note:a==='in'?'':'Clocked in outside the geofence'});
    toast(a==='in'?'Clocked in':'Clocked in. Flagged for your Crew Lead.'); render(); return; }
  if(a==='out'){ const s=openShift(m.id); s.out=Date.now(); if(s.review==='Open') s.review='Approved'; toast(`Clocked out · ${((s.out-s.in)/HR).toFixed(2)} h`); render(); return; }
  if(a==='note'){ const t=$('#pn').value.trim(); if(!t) return toast('Write a note first.'); log(Jb(open),t); drawer(); toast('Note added'); return; }
  if(a==='newest'){ estDraft=[{d:'Labor (hours)',q:1,p:85},{d:'Materials',q:1,p:0}]; drawer(); return; }
  if(a==='addline'){ readEst(); estDraft.push({d:'',q:1,p:0}); drawer(); return; }
  if(a==='cancelest'){ estDraft=null; drawer(); return; }
  if(a==='csv'){ const rows=TB[ts](), cols=rows.length?Object.keys(rows[0]):[], q=v=>{v=String(v??'');return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
    navigator.clipboard.writeText([cols.join(','),...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n')).then(()=>toast(`Copied ${rows.length} rows`),()=>toast('Copy was blocked. Select the table and copy instead.')); return; }
  if(a==='reset'){ const r=S.role; S=seed(); S.role=r; S.views.Admin='launch'; toast('Demo data reset'); render(); return; }
});
document.addEventListener('change',e=>{ const t=e.target;
  if(t.id==='role'){ S.role=t.value; open=null; drawer(); render(); window.scrollTo({top:0}); return; }
  if(t.id==='gps'){ S.gps[me().id]=t.value; render(); return; }
  if(t.dataset.setrole){ const u=U(t.dataset.setrole), from=u.role;
    if(from==='Admin'&&u.status==='Active'&&S.users.filter(x=>x.role==='Admin'&&x.status==='Active').length<2){ toast('Keep at least one active Admin.'); render(); return; }
    u.role=t.value; audit(`${u.name}: role ${ROLE_LABEL[from]} → ${ROLE_LABEL[t.value]}`);
    toast(`${u.name} is now ${ROLE_LABEL[t.value]}`+(['Crew','CrewLead'].includes(t.value)&&!u.rate?' · add an hourly rate':'')); render(); return; }
  if(t.dataset.setrate){ const u=U(t.dataset.setrate), c=Math.round(parseFloat(t.value)*100); if(!(c>0)){ toast('Enter a rate above $0.'); render(); return; } u.rate=c; audit(`${u.name}: rate set to ${usd(c)}/h`); toast(`${u.name}: ${usd(c)}/h`); render(); return; }
  if(t.dataset.set&&open){ const j=Jb(open), k=t.dataset.set;
    if(k==='crew'){ j.crew=t.value||null; if(j.crew&&j.status==='Requested') j.status='Accepted'; log(j,j.crew?'Assigned to '+U(j.crew).name:'Unassigned'); }
    if(k==='status'){ j.status=t.value; j.completed=t.value==='Completed'?Date.now():null; log(j,'Status: '+t.value); }
    if(k==='day'){ j.day=t.value?+t.value:null; if(j.day!=null&&['Requested','Accepted'].includes(j.status)&&j.crew) j.status='Scheduled'; log(j,j.day!=null?`Scheduled ${fDay(j.day)}, ${SLOTS[j.slot]}`:'Unscheduled'); }
    if(k==='slot'){ j.slot=+t.value; log(j,'Time: '+SLOTS[j.slot]); }
    render(); drawer(); }
});
document.addEventListener('input',e=>{ const t=e.target;
  if(t.dataset.ans!=null&&t.dataset.ans!==''){ S.answers[t.dataset.ans]=t.value; save(); }
  if(t.dataset.el!=null&&t.dataset.el!==''){ readEst(); const el=$('#et'); if(el) el.textContent=usd(Math.round(estDraft.reduce((a,l)=>a+l.q*l.p*100,0))); } });
document.addEventListener('submit',e=>{ e.preventDefault(); const f=e.target, m=me();
  if(f.id==='expForm'){ const a=Math.round(parseFloat($('#x-amt').value)*100); if(!(a>0)) return toast('Enter an amount above $0.');
    S.expenses.push({id:'X-'+(S.seq.x++),amount:a,cat:$('#x-cat').value,vendor:$('#x-ven').value.trim()||'Unspecified',job:$('#x-job').value||null,note:$('#x-note').value.trim(),date:Date.now(),by:m.id,status:'Submitted'});
    const jid=$('#x-job').value; if(jid) log(Jb(jid),`Expense ${usd(a)} submitted`); toast('Submitted for approval'); render(); return; }
  if(f.id==='invForm'){ const n=$('#i-name').value.trim(), c=$('#i-c').value.trim(), err=$('#i-err');
    const ok=invBy==='email'?/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c):c.replace(/\D/g,'').length>=10;
    if(!n){ err.innerHTML='<span style="color:var(--bad)">Add the person\'s name.</span>'; return; } if(!ok){ err.innerHTML=`<span style="color:var(--bad)">${invBy==='email'?'That email address looks incomplete.':'Enter a 10-digit phone number.'}</span>`; return; }
    const dig=s=>String(s||'').replace(/\D/g,'').slice(-10), dup=S.users.find(u=>invBy==='email'?(u.email||'').toLowerCase()===c.toLowerCase():u.phone&&dig(u.phone)===dig(c));
    if(dup){ err.innerHTML=`<span style="color:var(--bad)">${esc(dup.name)} already uses that ${invBy==='email'?'email address':'number'}.</span>`; return; }
    const role=$('#i-role').value; S.users.push({id:uid('u'),name:n,role,email:invBy==='email'?c:'',phone:invBy==='phone'?c:'',status:'Invited'}); audit(`Invited ${n} as ${ROLE_LABEL[role]}`); toast(`Invite recorded for ${n}`); render(); return; }
  if(f.id==='estForm'){ readEst(); const lines=estDraft.filter(l=>l.d.trim()&&l.q>0).map(l=>[l.d.trim(),l.q,Math.round(l.p*100)]); if(!lines.length) return toast('Add at least one line with an item and quantity.');
    const id='EST-'+(S.seq.est++), j=Jb(open); S.estimates.push({id,job:j.id,status:'Draft',created:Date.now(),by:m.id,lines}); log(j,`Estimate ${id} drafted`); estDraft=null; toast(`${id} saved as draft`); render(); drawer(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&open){ open=null; drawer(); } });
window.addEventListener('hashchange',()=>{ fromHash(); render(); });
fromHash(); render();
})();
</script>
